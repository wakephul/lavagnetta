name: Tieni sveglio il database

# Supabase gratuito mette in pausa i progetti fermi da una settimana.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >
          curl -fsS -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping"
          -H "apikey: ${{ vars.SUPABASE_KEY }}" -H 'Content-Type: application/json' -d '{}'
      # GitHub sospende i workflow programmati dopo 60 giorni senza commit;
      # riattivarlo a ogni giro serve a non farlo fermare d'estate.
      - run: gh workflow enable keepalive.yml -R "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
